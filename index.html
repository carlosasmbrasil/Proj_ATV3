<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas - Tempo de aposentadoria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Pessoas - Tempo de aposentadori</h1>
        <form id="formCadastro">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" required>

            <label for="nacionalidade">Nacionalidade:</label>
            <input type="text" id="nacionalidade" required>

            <label for="sexo">Sexo:</label>
            <select id="sexo" required>
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
            </select>

            <button type="submit">Salvar</button>
        </form>

        <h2>Lista de Registros</h2>
        <table id="tabelaRegistros">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Nacionalidade</th>
                    <th>Sexo</th>
                    <th>Tempo para aposentar</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <p id="contador">Total de registros: 0</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
